<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#8a7dff"/>
      <stop offset="0.55" stop-color="#5146e5"/>
      <stop offset="1" stop-color="#3527c4"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1a1060" flood-opacity="0.35"/>
    </filter>
    <filter id="glyph" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#160c5c" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- macOS icon grid: 824×824 body centred in 1024×1024 -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#gloss)"/>
  <g filter="url(#glyph)" fill="none" stroke="#ffffff" stroke-width="78" stroke-linecap="round" stroke-linejoin="round">
    <!-- arrow -->
    <path d="M512 286 V596"/>
    <path d="M374 466 L512 604 L650 466"/>
    <!-- tray -->
    <path d="M318 728 H706"/>
  </g>
</svg>
